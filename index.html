<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:">
  <title>Notepad</title>
  <!-- Fonts are bundled locally so the app works offline -->
  <link rel="stylesheet" href="node_modules/@fontsource-variable/fraunces/full.css">
  <link rel="stylesheet" href="node_modules/@fontsource-variable/fraunces/full-italic.css">
  <link rel="stylesheet" href="node_modules/@fontsource-variable/caveat/index.css">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <!-- Crumpled-paper effect for throwing a notes page away (see crumple() in app.js): a noise
       field is the paper's bumps; a light shades its creases and the same field warps the page
       along the wrinkles. app.js turns the bump height and warp up as the sheet crumples. -->
  <svg class="defs" aria-hidden="true" focusable="false">
    <filter id="crumple" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.02" numOctaves="4" seed="11" result="noise"/>
      <feComponentTransfer in="noise" result="bumps">
        <feFuncA type="gamma" amplitude="1" exponent="1.8" offset="0"/>
      </feComponentTransfer>
      <feDiffuseLighting in="bumps" lighting-color="#ffffff" surfaceScale="0" diffuseConstant="1.1" result="shade">
        <feDistantLight azimuth="230" elevation="58"/>
      </feDiffuseLighting>
      <feSpecularLighting in="bumps" lighting-color="#ffffff" surfaceScale="0" specularConstant="0.38" specularExponent="16" result="gleam">
        <feDistantLight azimuth="230" elevation="58"/>
      </feSpecularLighting>
      <feBlend in="SourceGraphic" in2="shade" mode="multiply" result="shaded"/>
      <feBlend in="shaded" in2="gleam" mode="screen" result="lit"/>
      <feComposite in="lit" in2="SourceAlpha" operator="in" result="paper"/>
      <feDisplacementMap in="paper" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <main class="scene">
    <h1 class="sr-only">Notepad</h1>

    <div class="clipboard">
      <div class="board">
        <!-- Index tabs: Notes, Week, then each day. Filled in by app.js -->
        <div class="tabs" role="tablist" aria-label="Notepad pages" aria-orientation="vertical"></div>

        <!-- The pad of paper. Pages are added by app.js -->
        <div class="pad">
          <div class="pad-base" aria-hidden="true"></div>
          <div class="pad-shade" aria-hidden="true"></div>
        </div>

        <!-- Desktop app only: window buttons in the page's corner, and a resize grip -->
        <div class="win-controls">
          <button type="button" class="win-btn win-btn--settings" data-settings title="Settings" aria-label="Settings">
            <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
          </button>
          <button type="button" class="win-btn win-btn--pin" data-pin title="Pin in place, in front of other apps" aria-label="Pin in place, in front of other apps" aria-pressed="false">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 1.5h3M5 1.5v3L3.5 6v1h5V6L7 4.5v-3M6 7v3.5"/></svg>
          </button>
          <button type="button" class="win-btn" data-win="minimize" title="Minimize" aria-label="Minimize">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7"/></svg>
          </button>
          <button type="button" class="win-btn win-btn--close" data-win="hide" title="Hide to tray" aria-label="Hide to tray">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
          </button>
        </div>
        <div class="resize-grip" title="Drag to resize" aria-hidden="true"></div>

        <!-- Desktop app only: Canvas toggle (bottom-left of the pad) -->
        <div class="canvas-bar">
          <label class="canvas-toggle">
            <input type="checkbox" class="canvas-check" aria-label="Show Canvas assignments">
            <span class="canvas-label">Canvas</span>
            <span class="canvas-hint" aria-live="polite"></span>
          </label>
        </div>

        <!-- Settings card (gear at the top-right) -->
        <section class="card settings-panel" hidden aria-label="Settings">
          <header class="cp-head">
            <h2 class="cp-title">Settings</h2>
            <button type="button" class="cp-close" aria-label="Close">×</button>
          </header>
          <div class="cp-body"></div>
        </section>

        <!-- Canvas card (from Settings, or the Canvas checkbox when nothing is connected) -->
        <section class="card canvas-panel" hidden aria-label="Canvas settings">
          <header class="cp-head">
            <h2 class="cp-title">Canvas</h2>
            <button type="button" class="cp-close" aria-label="Close">×</button>
          </header>
          <div class="cp-body"></div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
